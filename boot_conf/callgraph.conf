# Analysis-only build: per-TU call graph (.ci) and final GIMPLE SSA dump (*.optimized) next to each
# object file, with inlining disabled so every source-level function keeps its own node. Not for flashing.
CONFIG_COMPILER_OPT="-fcallgraph-info -fdump-tree-optimized-lineno -fno-inline -fno-inline-small-functions -fno-inline-functions-called-once"
