# ML-DSA-65 over SHA-256 image hash, mldsa-native (portable C), MLD_CONFIG_REDUCE_RAM
# KEY=mldsa65
# SIGN=
CONFIG_BOOT_SIGNATURE_TYPE_MLDSA=y
CONFIG_BOOT_SIGNATURE_TYPE_MLDSA_65=y
CONFIG_BOOT_MLDSA_REDUCE_RAM=y
# ML-DSA verify runs on the main stack (MCUboot default 10 KB); the build checks the minimum
CONFIG_MAIN_STACK_SIZE=45056
