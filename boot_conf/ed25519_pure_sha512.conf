# Ed25519 pure (signature over the whole image), TinyCrypt, SHA-512
# imgtool --pure always uses SHA-512 (64-byte KEYHASH TLV); MCUboot must be built with SHA-512 to accept it
# KEY=ed25519
# SIGN=--pure
CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y
CONFIG_BOOT_SIGNATURE_TYPE_PURE=y
CONFIG_BOOT_ED25519_TINYCRYPT=y
CONFIG_BOOT_IMG_HASH_ALG_SHA512=y
