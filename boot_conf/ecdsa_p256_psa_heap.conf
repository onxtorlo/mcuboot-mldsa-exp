# ECDSA P-256, PSA API + Mbed TLS/PSA core + 8 KB Mbed TLS heap
# (BOOT_ECDSA_PSA selects no heap: psa_crypto_init() at boot fails, key import -> PSA_ERROR_BAD_STATE)
# KEY=ecdsa_p256
# SIGN=
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
CONFIG_BOOT_ECDSA_PSA=y
CONFIG_MBEDTLS=y
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192
