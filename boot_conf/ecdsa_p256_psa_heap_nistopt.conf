# ECDSA P-256, PSA API + 8 KB Mbed TLS heap + NIST curve fast reduction (BOOT_ECDSA_MBEDTLS selects it, BOOT_ECDSA_PSA does not)
# KEY=ecdsa_p256
# SIGN=
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
CONFIG_BOOT_ECDSA_PSA=y
CONFIG_MBEDTLS=y
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192
CONFIG_MBEDTLS_ECP_NIST_OPTIM=y
